<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ruta del día</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--panel:#111118;--border:#1e1e2e;--text:#e8e8f0;--muted:#8a8aa0;--accent:#2ecc71;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#e5e7eb;color:var(--text);font-family:system-ui,sans-serif;overflow:hidden;}
#map{position:absolute;inset:0;}
/* Etiqueta con el nombre del cliente encima del pin */
.stop-label{background:rgba(17,17,24,.82)!important;color:#fff!important;border:none!important;box-shadow:0 1px 4px rgba(0,0,0,.4)!important;font-size:10px!important;font-weight:600!important;padding:1px 6px!important;border-radius:6px!important;white-space:nowrap;}
.stop-label::before{display:none!important;}
.pending-label{background:rgba(107,114,128,.9)!important;font-weight:500!important;}
/* Botones flotantes arriba */
#top{position:absolute;top:10px;left:10px;right:10px;z-index:800;display:flex;gap:8px;}
.tbtn{flex:1;padding:11px;border-radius:12px;border:none;font-size:13px;font-weight:700;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:6px;}
.tbtn.gmaps{background:#1a73e8;}
.tbtn.trace{background:var(--accent);}
/* Panel inferior con la lista */
#panel{position:absolute;left:0;right:0;bottom:0;z-index:800;background:var(--panel);border-top:1px solid var(--border);border-radius:16px 16px 0 0;max-height:40vh;overflow-y:auto;transform:translateY(calc(100% - 46px));transition:transform .3s ease;box-shadow:0 -4px 20px rgba(0,0,0,.3);}
#panel.open{transform:translateY(0);}
#panel-handle{padding:14px;text-align:center;font-size:12px;color:var(--muted);font-weight:700;}
.stop{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--border);}
.stop:active{background:rgba(255,255,255,.05);}
.num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#000;flex-shrink:0;}
.st-info{flex:1;min-width:0;}
.st-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:900;background:rgba(17,17,24,.95);border:1px solid rgba(46,204,113,.4);border-radius:20px;padding:9px 16px;font-size:12px;font-weight:700;color:var(--accent);display:none;white-space:nowrap;}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#6b7280;font-size:14px;padding:24px;z-index:700;}
#fitBtn{position:absolute;right:14px;bottom:60px;z-index:750;width:46px;height:46px;border-radius:50%;border:none;background:#111118;box-shadow:0 3px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;}
#fitBtn:active{transform:scale(.92);}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <button class="tbtn trace" onclick="traceRoute()">🧭 Trazar ruta</button>
  <button class="tbtn gmaps" onclick="openGmaps()">Google Maps ↗</button>
</div>
<div id="panel">
  <div id="panel-handle" onclick="togglePanel()">▲ Ver lista de clientes</div>
  <div id="panel-list"></div>
</div>
<div id="toast"></div>
<div id="empty">Sin clientes con ubicación para hoy.</div>
<button id="fitBtn" onclick="fitAll(true)" aria-label="Ver todos los clientes">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 3 21 3 21 9"></polyline>
    <polyline points="9 21 3 21 3 15"></polyline>
    <line x1="21" y1="3" x2="14" y2="10"></line>
    <line x1="3" y1="21" x2="10" y2="14"></line>
  </svg>
</button>

<script>
var map=null, stops=[], color='#2ecc71', markers=[], routeLayer=null, startMk=null;
var pending=[], pendingMarkers=[]; // clientes de la ruta SIN pedido hoy (grises)
var start=null; // {lat,lng} GPS del repartidor
var pendingMode=false; // modo pendientes: solo mostrar órdenes pendientes
var userInteracted=false; // true en cuanto el usuario toca/arrastra/hace zoom manual

function postCh(name, msg){ try{ window[name].postMessage(msg); }catch(e){} }

// Llamado desde Flutter con los pedidos YA ORDENADOS (más cercano→lejano desde la tienda)
function setStops(json){
  try{ stops=(typeof json==='string'?JSON.parse(json):json)||[]; }catch(e){ stops=[]; }
  stops=stops.filter(function(s){ return s.lat!=null && s.lng!=null; });
  if(stops.length && stops[0].route_color) color=stops[0].route_color;
  if(!map) initMap();
  render();
  updateEmpty();
}

// Clientes de la ruta SIN pedido hoy: se pintan en gris (inhabilitados) y al
// tocarlos se genera su pedido del día.
function setPending(json){
  try{ pending=(typeof json==='string'?JSON.parse(json):json)||[]; }catch(e){ pending=[]; }
  pending=pending.filter(function(s){ return s.lat!=null && s.lng!=null; });
  if(!map) initMap();
  renderPending();
  updateEmpty();
}

function togglePendingMode(){
  pendingMode=!pendingMode;
  postCh('PendingChannel', pendingMode?'on':'off');
}

function updateEmpty(){
  var none = !stops.length && !pending.length;
  document.getElementById('empty').style.display = none? 'flex':'none';
  document.getElementById('empty').textContent = 'Sin clientes con ubicación para hoy.';
}

// Llamado desde Flutter con la ubicación GPS actual
function setStart(lat,lng){
  start={lat:lat,lng:lng};
  if(!map) initMap();
  if(startMk){ map.removeLayer(startMk); }
  var icon=L.divIcon({className:'',html:'<div style="width:18px;height:18px;background:#1a73e8;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 4px rgba(26,115,232,.35),0 2px 6px rgba(0,0,0,.4)"></div>',iconSize:[18,18],iconAnchor:[9,9]});
  startMk=L.marker([lat,lng],{icon:icon,zIndexOffset:1000}).bindPopup('Tú estás aquí').addTo(map);
}

function initMap(){
  map=L.map('map',{zoomControl:true,attributionControl:false}).setView([20.56,-100.40],13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  // Detecta interaccion REAL del usuario (arrastrar, pellizcar, rueda, botones +/-)
  // para no pisar su zoom/posicion en los refrescos automaticos de datos.
  // fitBounds/flyTo programaticos NO disparan estos eventos DOM.
  var mapEl=document.getElementById('map');
  ['mousedown','touchstart','wheel'].forEach(function(evt){
    mapEl.addEventListener(evt, function(){ userInteracted=true; }, {passive:true});
  });
}

// Separa visualmente los pines que caen casi en el mismo punto (mismo lugar),
// en un pequeño círculo. NO cambia s.lat/s.lng reales (ruta/Google Maps intactas);
// solo agrega s._dlat/s._dlng para dibujarlos sin encimarse.
function declutter(list){
  var groups={};
  list.forEach(function(s){
    s._dlat=null; s._dlng=null;
    var key=s.lat.toFixed(4)+','+s.lng.toFixed(4); // ~11 m
    (groups[key]=groups[key]||[]).push(s);
  });
  Object.keys(groups).forEach(function(k){
    var g=groups[k];
    if(g.length>1){
      var R=0.00012; // ~13 m de separación
      var cosLat=Math.cos(g[0].lat*Math.PI/180)||1;
      g.forEach(function(s,i){
        var ang=2*Math.PI*i/g.length;
        s._dlat=s.lat+R*Math.cos(ang);
        s._dlng=s.lng+R*Math.sin(ang)/cosLat;
      });
    }
  });
}

// Color del pin: verde = completado Y pagado; gris = cancelado;
// mitad verde/mitad rojo = solo entregado O solo pagado (falta lo otro);
// rojo = pendiente (ni entregado ni pagado).
function pinVisual(s){
  var st=(s.status||'').toLowerCase();
  if(st==='cancelado') return {bg:'#9ca3af', text:'#fff'};
  if(s.done) return {bg:'#2ecc71', text:'#000'};
  if(!!s.delivered !== !!s.paid) return {bg:'linear-gradient(90deg,#2ecc71 50%,#e74c3c 50%)', text:'#fff'};
  return {bg:'#e74c3c', text:'#fff'};
}

function render(){
  markers.forEach(function(m){ map.removeLayer(m.marker); }); markers=[];
  declutter(stops);
  var list=document.getElementById('panel-list'); list.innerHTML='';
  var pts=[];

  stops.forEach(function(s,idx){
    // Posición para dibujar (separada si compartía lugar); real para la ruta
    var dlat=s._dlat!=null?s._dlat:s.lat, dlng=s._dlng!=null?s._dlng:s.lng;
    pts.push([dlat,dlng]);
    var v=pinVisual(s);
    var icon=L.divIcon({className:'',html:'<div style="width:26px;height:26px;background:'+v.bg+';border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:'+v.text+';box-shadow:0 2px 6px rgba(0,0,0,.4)">'+(idx+1)+'</div>',iconSize:[26,26],iconAnchor:[13,13]});
    var mk=L.marker([dlat,dlng],{icon:icon}).addTo(map);
    mk.bindTooltip(s.name||'', {permanent:true, direction:'top', offset:[0,-15], className:'stop-label'});
    mk.on('click', function(){
      postCh('OrderChannel', String(s.customer_id));
    });
    markers.push({marker:mk,stop:s});

    var row=document.createElement('div');
    row.className='stop';
    row.innerHTML='<div class="num" style="background:'+v.bg+';color:'+v.text+'">'+(idx+1)+'</div><div class="st-info"><div class="st-name">'+s.name+'</div><div class="st-sub">'+(s.items||'')+'</div></div>';
    row.onclick=function(){
      focusStop(s);
      postCh('OrderChannel', String(s.customer_id));
    };
    list.appendChild(row);
  });

  fitAll();
}

// Marcadores grises para clientes sin pedido hoy (tocar = generar su pedido)
function renderPending(){
  pendingMarkers.forEach(function(m){ map.removeLayer(m); }); pendingMarkers=[];
  declutter(pending);
  pending.forEach(function(s){
    var dlat=s._dlat!=null?s._dlat:s.lat, dlng=s._dlng!=null?s._dlng:s.lng;
    var icon=L.divIcon({className:'',html:'<div style="width:24px;height:24px;background:#9ca3af;border:2px dashed #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);opacity:.9">+</div>',iconSize:[24,24],iconAnchor:[12,12]});
    var mk=L.marker([dlat,dlng],{icon:icon,zIndexOffset:-100}).addTo(map);
    mk.bindTooltip((s.name||'')+' · sin pedido', {permanent:true, direction:'top', offset:[0,-14], className:'stop-label pending-label'});
    mk.on('click', function(){ postCh('GenerateChannel', JSON.stringify({customer_id: s.customer_id, lat: s.lat, lng: s.lng, name: s.name})); });
    pendingMarkers.push(mk);
  });
  fitAll();
}

// Ajusta el mapa a todo lo visible: SOLO paradas + clientes grises (sin el GPS
// propio, que puede estar lejos y desencuadrar la vista de los clientes).
// Si el usuario ya interactuo con el mapa (zoom/arrastre manual), los refrescos
// automaticos de datos (setStops/setPending tras completar un pedido, etc.) ya
// NO le pisan su vista — solo el boton manual (force=true) puede volver a encuadrar.
function fitAll(force){
  if(userInteracted && !force) return;
  var pts=[];
  stops.forEach(function(s){ pts.push([s._dlat!=null?s._dlat:s.lat, s._dlng!=null?s._dlng:s.lng]); });
  pending.forEach(function(s){ pts.push([s.lat,s.lng]); });
  if(pts.length) map.fitBounds(L.latLngBounds(pts),{padding:[60,60]});
}

function focusStop(s){ var dlat=s._dlat!=null?s._dlat:s.lat, dlng=s._dlng!=null?s._dlng:s.lng; map.flyTo([dlat,dlng],17,{animate:true,duration:.6}); }

// Traza la ruta real: GPS → parada 1 → parada 2 → ... (en el orden dado)
async function traceRoute(){
  if(!stops.length) return;
  if(routeLayer){ map.removeLayer(routeLayer); routeLayer=null; }
  var seq=[];
  if(start) seq.push([start.lng,start.lat]);
  stops.forEach(function(s){ seq.push([s.lng,s.lat]); });
  if(seq.length<2){ showToast('Activa tu ubicación para trazar'); return; }
  try{
    var coordStr=seq.map(function(c){ return c[0]+','+c[1]; }).join(';');
    var url='https://router.project-osrm.org/route/v1/driving/'+coordStr+'?overview=full&geometries=geojson';
    var res=await fetch(url); var data=await res.json();
    if(data.code!=='Ok') throw 0;
    var route=data.routes[0];
    var coords=route.geometry.coordinates.map(function(c){ return [c[1],c[0]]; });
    routeLayer=L.polyline(coords,{color:'#1a73e8',weight:5,opacity:.8}).addTo(map);
    map.fitBounds(routeLayer.getBounds(),{padding:[50,50]});
    var km=(route.distance/1000).toFixed(1), min=Math.round(route.duration/60);
    showToast('🚗 '+min+' min · '+km+' km · '+stops.length+' paradas');
  }catch(e){ showToast('No se pudo trazar la ruta'); }
}

// Link único de toda la ruta en Google Maps (origen = GPS, paradas en orden)
function openGmaps(){
  if(!stops.length) return;
  var base='https://www.google.com/maps/dir/?api=1&travelmode=driving';
  if(start) base+='&origin='+start.lat+','+start.lng;
  var dest=stops[stops.length-1];
  base+='&destination='+dest.lat+','+dest.lng;
  if(stops.length>1){
    var wp=stops.slice(0,-1).map(function(s){ return s.lat+','+s.lng; }).join('|');
    base+='&waypoints='+encodeURIComponent(wp);
  }
  postCh('MapChannel', base);
}

function showToast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(function(){ t.style.display='none'; },4500); }
function togglePanel(){ var p=document.getElementById('panel'); p.classList.toggle('open'); document.querySelector('#panel-handle').textContent=(p.classList.contains('open')?'▼ ':'▲ ')+'Ver lista de clientes'; }
</script>
</body>
</html>
